<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shree Vidyasagram — Return Goods</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --ink: #1c2430;
    --ink-soft: #5b6472;
    --paper: #f6f4ef;
    --card: #ffffff;
    --line: #dcd7cc;
    --accent: #2f5233;
    --accent-soft: #e7efe8;
    --danger: #a4442e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: var(--ink);
    color: #f6f4ef;
    padding: 18px 20px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header .brand { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.02em; }
  header .sub { font-size: 0.78rem; color: #b7bdc4; }
  nav {
    display: flex;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  nav button {
    flex: 1;
    padding: 14px 10px;
    background: none;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { max-width: 640px; margin: 0 auto; padding: 18px 16px 60px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  input, select {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 0.95rem;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field { margin-bottom: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .items-head, .item-row {
    display: grid;
    grid-template-columns: 1.6fr 0.7fr 0.9fr 0.9fr 30px;
    gap: 8px;
    align-items: center;
  }
  .items-head { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin-bottom: 6px; }
  .item-row { margin-bottom: 8px; }
  .item-row input { padding: 8px 9px; font-size: 0.88rem; }
  .item-total { font-size: 0.88rem; padding: 8px 0; text-align: right; font-variant-numeric: tabular-nums; }
  .rm-btn {
    border: none; background: none; color: var(--danger); font-size: 1.1rem;
    cursor: pointer; line-height: 1; padding: 4px;
  }
  .add-item {
    margin-top: 4px; background: var(--accent-soft); color: var(--accent);
    border: 1px dashed var(--accent); border-radius: 7px; padding: 9px 12px;
    font-size: 0.85rem; font-weight: 600; cursor: pointer; width: 100%;
  }
  .grand-total {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 1.05rem; font-weight: 700;
  }
  .grand-total span:last-child { font-variant-numeric: tabular-nums; }
  .primary-btn {
    width: 100%; padding: 13px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 1rem; font-weight: 700;
    cursor: pointer; margin-top: 16px;
  }
  .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { text-align: center; color: var(--ink-soft); padding: 40px 20px; font-size: 0.92rem; }
  .slip-card {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 14px 16px; cursor: pointer;
  }
  .slip-card + .slip-card { border-top: 1px solid var(--line); }
  .slip-main .party { font-weight: 700; font-size: 0.98rem; }
  .slip-main .meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 2px; }
  .slip-amount { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .detail-back { background: none; border: none; color: var(--accent); font-weight: 600; padding: 0 0 12px; cursor: pointer; font-size: 0.9rem; }
  .detail-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.88rem; }
  .detail-table th, .detail-table td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); }
  .detail-table th { color: var(--ink-soft); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
  .detail-table td:nth-child(n+2), .detail-table th:nth-child(n+2) { text-align: right; }
  .action-row { display: flex; gap: 10px; margin-top: 16px; }
  .action-row button {
    flex: 1; padding: 11px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  .btn-outline { background: #fff; border: 1px solid var(--accent); color: var(--accent); }
  .btn-fill { background: var(--accent); border: none; color: #fff; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 0.85rem; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }
  .storage-note {
    font-size: 0.72rem; color: var(--ink-soft); text-align: center; margin-top: 18px; line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">SHREE VIDYASAGRAM</div>
    <div class="sub">Return Goods</div>
  </div>
</header>

<nav>
  <button id="tab-new" class="active" onclick="showTab('new')">New Return</button>
  <button id="tab-history" onclick="showTab('history')">History</button>
</nav>

<main>

  <!-- NEW RETURN SLIP -->
  <section id="view-new">
    <div class="card">
      <div class="row2">
        <div class="field">
          <label for="partyName">Party Name</label>
          <input id="partyName" type="text" placeholder="e.g. Naman Enterprise">
        </div>
        <div class="field">
          <label for="dmNumber">DM Number</label>
          <input id="dmNumber" type="text" placeholder="e.g. DM-1042">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="items-head">
        <div>Article No.</div><div>Qty</div><div>Price/Pc</div><div>Total</div><div></div>
      </div>
      <div id="itemsContainer"></div>
      <button class="add-item" onclick="addItemRow()">+ Add item</button>
      <div class="grand-total"><span>Grand Total</span><span id="grandTotal">₹0.00</span></div>
      <button class="primary-btn" id="saveBtn" onclick="saveSlip()">Save &amp; Generate PDF</button>
    </div>
  </section>

  <!-- HISTORY LIST -->
  <section id="view-history" style="display:none">
    <div class="card" style="padding:0" id="historyList"></div>
  </section>

  <!-- SLIP DETAIL -->
  <section id="view-detail" style="display:none">
    <button class="detail-back" onclick="showTab('history')">&larr; Back to history</button>
    <div class="card" id="detailCard"></div>
  </section>

  <div class="storage-note">
    Return slips are saved securely in the shared cloud database, so authorized devices can see the same history.
  </div>

</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC-k7mOHj5XSshZ2dG0Hqfcc8rHqR3e7tU",
    authDomain: "return-goods-255c7.firebaseapp.com",
    projectId: "return-goods-255c7",
    storageBucket: "return-goods-255c7.firebasestorage.app",
    messagingSenderId: "76859901881",
    appId: "1:76859901881:web:19d22f279839eae8c0d868",
    measurementId: "G-XXQ9NP2G1D"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const slipsCollection = collection(db, "returnSlips");
  const { jsPDF } = window.jspdf;

  let items = [];
  let cloudSlips = [];

  function uid() {
    return Array.from(crypto.getRandomValues(new Uint8Array(4)))
      .map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function money(n) {
    return '₹' + (Math.round(n * 100) / 100).toFixed(2);
  }

  function addItemRow(data) {
    const row = { id: uid(), article: data?.article || '', qty: data?.qty ?? '', price: data?.price ?? '' };
    items.push(row);
    renderItems();
  }

  function removeItemRow(id) {
    items = items.filter(i => i.id !== id);
    if (items.length === 0) addItemRow();
    else renderItems();
  }

  function renderItems() {
    const container = document.getElementById('itemsContainer');
    container.innerHTML = '';
    items.forEach(row => {
      const div = document.createElement('div');
      div.className = 'item-row';
      div.innerHTML = `
        <input type="text" value="${escapeHtml(row.article)}" placeholder="Article #" oninput="updateItem('${row.id}','article',this.value)">
        <input type="number" min="0" value="${row.qty}" placeholder="0" oninput="updateItem('${row.id}','qty',this.value)">
        <input type="number" min="0" step="0.01" value="${row.price}" placeholder="0.00" oninput="updateItem('${row.id}','price',this.value)">
        <div class="item-total">${money((parseFloat(row.qty) || 0) * (parseFloat(row.price) || 0))}</div>
        <button class="rm-btn" onclick="removeItemRow('${row.id}')" title="Remove">✕</button>
      `;
      container.appendChild(div);
    });
    updateGrandTotal();
  }

  function updateItem(id, field, value) {
    const row = items.find(i => i.id === id);
    if (row) row[field] = value;
    updateGrandTotal();
    const idx = items.findIndex(i => i.id === id);
    const cell = document.getElementById('itemsContainer').children[idx]?.querySelector('.item-total');
    if (cell) {
      const r = items[idx];
      cell.textContent = money((parseFloat(r.qty) || 0) * (parseFloat(r.price) || 0));
    }
  }

  function updateGrandTotal() {
    const total = items.reduce((sum, r) => sum + (parseFloat(r.qty) || 0) * (parseFloat(r.price) || 0), 0);
    document.getElementById('grandTotal').textContent = money(total);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function showTab(tab) {
    document.getElementById('view-new').style.display = tab === 'new' ? 'block' : 'none';
    document.getElementById('view-history').style.display = tab === 'history' ? 'block' : 'none';
    document.getElementById('view-detail').style.display = tab === 'detail' ? 'block' : 'none';
    document.getElementById('tab-new').classList.toggle('active', tab === 'new');
    document.getElementById('tab-history').classList.toggle('active', tab === 'history');
    if (tab === 'history') renderHistory();
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  async function loadSlips() {
    try {
      const q = query(slipsCollection, orderBy("date", "desc"));
      const snapshot = await getDocs(q);
      cloudSlips = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      return cloudSlips;
    } catch (e) {
      console.error('Could not read cloud slips', e);
      toast('Could not load cloud history');
      return [];
    }
  }

  async function saveSlip() {
    const party = document.getElementById('partyName').value.trim();
    const dm = document.getElementById('dmNumber').value.trim();
    const validItems = items
      .map(r => ({ article: r.article.trim(), qty: parseFloat(r.qty) || 0, price: parseFloat(r.price) || 0 }))
      .filter(r => r.article && r.qty > 0);

    if (!party) { toast('Enter a Party Name'); return; }
    if (validItems.length === 0) { toast('Add at least one item with qty'); return; }

    const slip = {
      date: new Date().toISOString(),
      party,
      dmNumber: dm,
      items: validItems,
      grandTotal: validItems.reduce((s, r) => s + r.qty * r.price, 0)
    };

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;

    try {
      const docRef = await addDoc(slipsCollection, slip);
      const savedSlip = { id: docRef.id, ...slip };

      generatePDF(savedSlip, { download: true });
      toast('Return slip saved');

      document.getElementById('partyName').value = '';
      document.getElementById('dmNumber').value = '';
      items = [];
      addItemRow();

      await loadSlips();
    } catch (e) {
      console.error('Could not save slip', e);
      toast('Could not save — check Firebase rules');
    } finally {
      saveBtn.disabled = false;
    }
  }

  function generatePDF(slip, opts) {
    opts = opts || {};
    const doc = new jsPDF({ unit: 'pt', format: 'a5' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const marginX = 40;
    let y = 50;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text('SHREE VIDYASAGRAM', pageWidth / 2, y, { align: 'center' });
    y += 20;
    doc.setFontSize(11);
    doc.setFont('helvetica', 'normal');
    doc.text('RETURN GOODS', pageWidth / 2, y, { align: 'center' });
    y += 26;

    doc.setFontSize(10);
    const dateStr = new Date(slip.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    doc.text(`Date: ${dateStr}`, marginX, y);
    y += 16;
    doc.text(`Party: ${slip.party}`, marginX, y);
    y += 16;
    doc.text(`DM No.: ${slip.dmNumber || '-'}`, marginX, y);
    y += 20;

    doc.setFont('helvetica', 'bold');
    const col = { article: marginX, qty: pageWidth - 190, price: pageWidth - 130, total: pageWidth - 60 };
    doc.text('Article', col.article, y);
    doc.text('Qty', col.qty, y, { align: 'right' });
    doc.text('Price', col.price, y, { align: 'right' });
    doc.text('Total', col.total, y, { align: 'right' });
    y += 6;
    doc.line(marginX, y, pageWidth - 40, y);
    y += 14;

    doc.setFont('helvetica', 'normal');
    slip.items.forEach(item => {
      const lineTotal = item.qty * item.price;
      doc.text(String(item.article), col.article, y);
      doc.text(String(item.qty), col.qty, y, { align: 'right' });
      doc.text(item.price.toFixed(2), col.price, y, { align: 'right' });
      doc.text(lineTotal.toFixed(2), col.total, y, { align: 'right' });
      y += 16;
    });

    y += 6;
    doc.line(marginX, y, pageWidth - 40, y);
    y += 18;
    doc.setFont('helvetica', 'bold');
    doc.text('Grand Total', col.price, y, { align: 'right' });
    doc.text(slip.grandTotal.toFixed(2), col.total, y, { align: 'right' });
    y += 40;

    doc.setFont('helvetica', 'italic');
    doc.setFontSize(11);
    doc.text('THANK YOU', pageWidth / 2, y, { align: 'center' });

    const filename = `RETURN_${slip.id}.pdf`;

    if (opts.download) doc.save(filename);
    return { doc, filename };
  }

  async function sharePDF(slip) {
    const { doc, filename } = generatePDF(slip, { download: false });
    const blob = doc.output('blob');
    const file = new File([blob], filename, { type: 'application/pdf' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: `Return Slip — ${slip.party}`,
          text: `Return goods slip for ${slip.party}, DM No. ${slip.dmNumber || '-'}`
        });
        return;
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
    }

    doc.save(filename);
    toast('Sharing not supported here — PDF downloaded instead');
  }

  async function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = '<div class="empty">Loading cloud history...</div>';
    const slips = await loadSlips();

    if (slips.length === 0) {
      list.innerHTML = '<div class="empty">No return slips yet.<br>Create one from the New Return tab.</div>';
      return;
    }

    list.innerHTML = '';
    slips.forEach(slip => {
      const div = document.createElement('div');
      div.className = 'slip-card';
      const d = new Date(slip.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
      div.innerHTML = `
        <div class="slip-main">
          <div class="party">${escapeHtml(slip.party)}</div>
          <div class="meta">DM ${escapeHtml(slip.dmNumber || '-')} · ${d}</div>
        </div>
        <div class="slip-amount">${money(slip.grandTotal)}</div>
      `;
      div.onclick = () => viewSlip(slip.id);
      list.appendChild(div);
    });
  }

  async function viewSlip(id) {
    const slips = cloudSlips.length ? cloudSlips : await loadSlips();
    const slip = slips.find(s => s.id === id);
    if (!slip) return;
    const d = new Date(slip.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });

    const rows = slip.items.map(item => `
      <tr>
        <td>${escapeHtml(item.article)}</td>
        <td>${item.qty}</td>
        <td>${money(item.price)}</td>
        <td>${money(item.qty * item.price)}</td>
      </tr>
    `).join('');

    document.getElementById('detailCard').innerHTML = `
      <div style="font-weight:700; font-size:1.05rem;">${escapeHtml(slip.party)}</div>
      <div style="color:var(--ink-soft); font-size:0.85rem; margin-top:4px;">DM No. ${escapeHtml(slip.dmNumber || '-')} · ${d}</div>
      <table class="detail-table">
        <thead><tr><th>Article</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="grand-total"><span>Grand Total</span><span>${money(slip.grandTotal)}</span></div>
      <div class="action-row">
        <button class="btn-outline" id="downloadDetailBtn">Download PDF</button>
        <button class="btn-fill" id="shareDetailBtn">Share</button>
      </div>
    `;

    document.getElementById('downloadDetailBtn').onclick = () => generatePDF(slip, {download:true});
    document.getElementById('shareDetailBtn').onclick = () => sharePDF(slip);

    showTab('detail');
  }

  // Keep the existing inline HTML buttons working with the module script.
  window.addItemRow = addItemRow;
  window.removeItemRow = removeItemRow;
  window.updateItem = updateItem;
  window.showTab = showTab;
  window.saveSlip = saveSlip;
  window.sharePDF = sharePDF;
  window.generatePDF = generatePDF;
  window.viewSlip = viewSlip;

  addItemRow();
</script>
</body>
</html>
